[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-scorer"
version = "0.2.0"
description = "Standalone reward-independent TRACE trajectory scorer"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0"]

[project.scripts]
trace-score = "trace_scorer.score_candidates:main"
trace-attach-scores = "trace_scorer.attach_scores:main"
trace-export-selection = "trace_scorer.export_selection_manifest:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trace_scorer*"]
